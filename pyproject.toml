[project]
name = "amap-landmark-navsim"
version = "0.1.0"
description = "Landmark-aware navigation simulator built on Amap route, POI, and reverse-geocoding APIs."
requires-python = ">=3.11"
dependencies = [
    "diskcache>=5.6.3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.3",
]

[project.scripts]
landmark-nav = "landmark_nav.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landmark_nav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["landmark_nav"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["diskcache"]
ignore_missing_imports = true
